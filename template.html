<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      div,
      p,
      a,
      li,
      td {
        -webkit-text-size-adjust: none;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff">
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        background-color: #ffffff;
        padding: 20px 20px;
        font-family: Gill Sans, Cochin, Georgia, Times, 'Times New Roman', serif, sans-serif;
        letter-spacing: -0.03rem;
        box-sizing: border-box;
      "
    >
      <tbody>
        <tr>
          <td align="center">
            <table
              class="email-card"
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="
                width: 100%;
                max-width: 850px;
                background-color: #e4eef0;
                border-radius: 6px;
                overflow: hidden;
                border-collapse: collapse;
              "
            >
              <tbody>
                <tr>
                  <td style="padding-bottom: 20px; text-align: center">
                    <img
                      src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/assets/anvesha_banner_2.png"
                      alt="Anvesha header"
                      style="
                        display: block;
                        width: 100%;
                        height: auto;
                        border: 0;
                      "
                    />
                  </td>
                </tr>
                <tr>
                  <td style="padding: 20px 20px 10px; text-align: center">
                    <h2
                      style="
                        margin: 0;
                        font-size: 1.25rem;
                        color: #8ba2ba;
                        font-weight: normal;
                      "
                    >
                      Greetings from Anvesha!<br />
                    </h2>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 10px; text-align: center">
                    <h1 style="margin: 0 50px; font-size: 2rem; color: #5E7B9A">
                      ${Title}
                    </h1>
                  </td>
                </tr>
                <tr>
                  <td
                    style="
                      padding: 0 45px 30px 45px;
                      color: #4b5b6c;
                      font-size: 1.15rem;
                      letter-spacing: 0rem;
                      line-height: 1.5;
                    "
                  >
                    ${Content}
                  </td>
                </tr>
                <tr>
                  <td
                    bgcolor="#000000"
                    style="
                      background-color: #000000;
                      font-family:
                        Gill Sans,
                        Cochin,
                        Georgia,
                        Times,
                        &quot;Times New Roman&quot;,
                        serif,
                        sans-serif;
                      padding: 10px 20px 10px;
                      text-align: center;
                    "
                  >
                    </a>
                    <p
                      style="
                        margin: 20px auto 26px;
                        max-width: 400px;
                        font-size: 0.85rem;
                        font-family: Times New Roman;
                        letter-spacing: 0.03rem;
                        color: #ffffff;
                        line-height: 1.4;
                      "
                    >
                      Anvesha, the annual science expo of IISER Thiruvananthapuram, is a premier event organised by the Science and Technology Council of IISER Thiruvananthapuram.
                    </p>
                    <p style="color: #aaaaaa; margin: 0">
                      <a
                        href="https://www.instagram.com/anveshaiiser"
                        style="text-decoration: none"
                        target="_blank"
                        ><img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/instagram.png"
                          alt="Instagram"
                          width="24"
                          height="24"
                          style="vertical-align: middle; margin: 0"
                      /></a>
                      &nbsp; | &nbsp;
                      <a
                        href="mailto:stc@iisertvm.ac.in"
                        style="text-decoration: none"
                        ><img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/gmail.png"
                          alt="Gmail"
                          width="24"
                          height="24"
                          style="vertical-align: middle; margin: 0"
                      /></a>
                      &nbsp; | &nbsp;
                      <a
                        href="https://www.facebook.com/anvesha.iisertvm"
                        style="text-decoration: none"
                        target="_blank"
                        ><img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/facebook.png"
                          alt="Facebook"
                          width="24"
                          height="24"
                          style="vertical-align: middle; margin: 0"
                      /></a>
                      &nbsp; | &nbsp;
                      <a
                        href="https://x.com/Anvesha_IISER"
                        style="text-decoration: none"
                        target="_blank"
                        ><img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/twitter.png"
                          alt="Twitter"
                          width="24"
                          height="24"
                          style="vertical-align: middle; margin: 0"
                      /></a>
                      &nbsp; | &nbsp;
                      <a
                        href="https://youtube.com/@stciisertvm"
                        style="text-decoration: none"
                        target="_blank"
                        ><img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/youtube.png"
                          alt="YouTube"
                          width="24"
                          height="24"
                          style="vertical-align: middle; margin: 0"
                      /></a>
                    </p>
                    <p
                      style="
                        font-size: 0.8rem;
                        color: #ffffff;
                        margin-top: 30px;
                      "
                    >
                      © All Rights Reserved
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
