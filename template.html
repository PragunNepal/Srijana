<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      div,
      p,
      a,
      li,
      td {
        -webkit-text-size-adjust: none;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff">
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        padding: 20px 20px;
        font-family:
          Gill Sans,
          Cochin,
          Georgia,
          Times,
          &quot;Times New Roman&quot;,
          serif,
          sans-serif;
        letter-spacing: -0.03rem;
        box-sizing: border-box;
      "
    >
      <tbody>
        <tr>
          <td align="center">
            <table
              class="email-card"
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="
                width: 100%;
                max-width: 850px;
                background-color: #e8eef3;
                border-radius: 15px;
                overflow: hidden;
                border-collapse: collapse;
              "
            >
              <tbody>
                <tr>
                  <td style="padding-bottom: 20px; text-align: center">
                    <img
                      src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/assets/anvesha_banner_3.png"
                      alt="Anvesha header"
                      style="
                        display: block;
                        width: 100%;
                        height: auto;
                        border: 0;
                      "
                    />
                  </td>
                </tr>
                <tr>
                  <td style="padding: 20px 20px 10px; text-align: center">
                    <h2
                      style="
                        margin: 0;
                        font-size: 1.25rem;
                        color: #8ba2ba;
                        font-weight: normal;
                      "
                    >
                      Greetings from Anvesha!<br />
                    </h2>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 10px; text-align: center">
                    <h1 style="margin: 0 50px; font-size: 2rem; color: #5e7b9a">
                      ${Title}
                    </h1>
                  </td>
                </tr>
                <tr>
                  <td
                    style="
                      padding: 0 45px 30px 45px;
                      color: #4b5b6c;
                      font-size: 1.15rem;
                      letter-spacing: 0rem;
                      line-height: 1.5;
                    "
                  >
                    ${Content}
                  </td>
                </tr>
                <tr>
                  <td
                    style="
                      text-align: center;
                      position: relative;
                      line-height: 0;
                    "
                  >
                    <img
                      src="assets/anvesha_footer.png"
                      alt="Anvesha footer"
                      width="600"
                      style="
                        display: block;
                        width: 100%;
                        max-width: 100%;
                        height: auto;
                        border: 0;
                      "
                    />
                    <div
                      style="
                        position: absolute;
                        bottom: 20px;
                        left: 0;
                        width: 100%;
                        text-align: center;
                        z-index: 10;
                        line-height: normal;
                      "
                    >
                      <!-- Rounded Container Card -->
                      <div
                        style="
                          display: inline-block;
                          background-color: rgba(255, 255, 255, 0.85);
                          padding: 10px 10px;
                          border-radius: 10px;
                        "
                      >
                        <a
                          href="https://www.instagram.com/anveshaiiser"
                          style="
                            text-decoration: none;
                            margin: 0 6px;
                            display: inline-block;
                          "
                          target="_blank"
                        >
                          <img
                            src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/instagram.png"
                            alt="Instagram"
                            width="24"
                            height="24"
                            style="vertical-align: middle; border: 0"
                          />
                        </a>
                        <a
                          href="mailto:stc@iisertvm.ac.in"
                          style="
                            text-decoration: none;
                            margin: 0 6px;
                            display: inline-block;
                          "
                        >
                          <img
                            src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/gmail.png"
                            alt="Gmail"
                            width="24"
                            height="24"
                            style="vertical-align: middle; border: 0"
                          />
                        </a>
                        <a
                          href="https://www.facebook.com/anvesha.iisertvm"
                          style="
                            text-decoration: none;
                            margin: 0 6px;
                            display: inline-block;
                          "
                          target="_blank"
                        >
                          <img
                            src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/facebook.png"
                            alt="Facebook"
                            width="24"
                            height="24"
                            style="vertical-align: middle; border: 0"
                          />
                        </a>
                        <a
                          href="https://x.com/Anvesha_IISER"
                          style="
                            text-decoration: none;
                            margin: 0 6px;
                            display: inline-block;
                          "
                          target="_blank"
                        >
                          <img
                            src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/twitter.png"
                            alt="Twitter"
                            width="24"
                            height="24"
                            style="vertical-align: middle; border: 0"
                          />
                        </a>
                        <a
                          href="https://youtube.com/@stciisertvm"
                          style="
                            text-decoration: none;
                            margin: 0 6px;
                            display: inline-block;
                          "
                          target="_blank"
                        >
                          <img
                            src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/youtube.png"
                            alt="YouTube"
                            width="24"
                            height="24"
                            style="vertical-align: middle; border: 0"
                          />
                        </a>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
