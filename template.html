<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      div,
      p,
      a,
      li,
      td {
        -webkit-text-size-adjust: none;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff">
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        padding: 20px 20px;
        font-family:
          Gill Sans,
          Cochin,
          Georgia,
          Times,
          'Times New Roman',
          serif,
          sans-serif;
        letter-spacing: -0.03rem;
        box-sizing: border-box;
      "
    >
      <tbody>
        <tr>
          <td align="center">
            <table
              class="email-card"
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="
                width: 100%;
                max-width: 850px;
                background-color: #e8eef3;
                border-radius: 15px;
                overflow: hidden;
                border-collapse: collapse;
              "
            >
              <tbody>
                <!-- Header Image -->
                <tr>
                  <td style="padding-bottom: 20px; text-align: center">
                    <img
                      src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/assets/anvesha_header.png"
                      alt="Anvesha header"
                      style="
                        display: block;
                        width: 100%;
                        height: auto;
                        border: 0;
                      "
                    />
                  </td>
                </tr>

                <!-- Greetings -->
                <tr>
                  <td style="padding: 20px 20px 10px; text-align: center">
                    <h2
                      style="
                        margin: 0;
                        font-size: 1.25rem;
                        color: #8ba2ba;
                        font-weight: normal;
                      "
                    >
                      Greetings from Anvesha!<br />
                    </h2>
                  </td>
                </tr>

                <!-- Title -->
                <tr>
                  <td style="padding: 10px; text-align: center">
                    <h1 style="margin: 0 50px; font-size: 2rem; color: #5e7b9a">
                      ${Title}
                    </h1>
                  </td>
                </tr>

                <!-- Content -->
                <tr>
                  <td
                    style="
                      padding: 0 45px 30px 45px;
                      color: #4b5b6c;
                      font-size: 1.15rem;
                      letter-spacing: 0rem;
                      line-height: 1.5;
                    "
                  >
                    ${Content}
                  </td>
                </tr>

                <!-- Footer Image Row -->
                <tr>
                  <td style="line-height: 0; padding: 0; margin: 0">
                    <img
                      src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/assets/anvesha_footer.png"
                      alt="Anvesha footer"
                      style="
                        display: block;
                        width: 100%;
                        height: auto;
                        border: 0;
                        margin: 0;
                        padding: 0;
                      "
                    />
                  </td>
                </tr>

                <!-- Pill Row (Protected from Dark Mode) -->
                <tr>
                  <td
                    align="center"
                    style="
                      padding: 20px 0;
                      text-align: center;
                      background-color: #95bd8b;
                      background-image: linear-gradient(#95bd8b, #95bd8b);
                      color-scheme: light only;
                    "
                  >
                    <!-- Floating Pill Container -->
                    <div
                      style="
                        display: inline-block;
                        background-color: #ffffff;
                        background-image: linear-gradient(#ffffff, #ffffff);
                        padding: 10px 10px;
                        border-radius: 10px;
                      "
                    >
                      <a
                        href="https://www.instagram.com/anveshaiiser"
                        target="_blank"
                        style="
                          text-decoration: none;
                          margin: 0 6px;
                          display: inline-block;
                        "
                      >
                        <img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/instagram.png"
                          alt="Instagram"
                          width="24"
                          height="24"
                          style="vertical-align: middle; border: 0"
                        />
                      </a>
                      <a
                        href="mailto:stc@iisertvm.ac.in"
                        style="
                          text-decoration: none;
                          margin: 0 6px;
                          display: inline-block;
                        "
                      >
                        <img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/gmail.png"
                          alt="Gmail"
                          width="24"
                          height="24"
                          style="vertical-align: middle; border: 0"
                        />
                      </a>
                      <a
                        href="https://www.facebook.com/anvesha.iisertvm"
                        target="_blank"
                        style="
                          text-decoration: none;
                          margin: 0 6px;
                          display: inline-block;
                        "
                      >
                        <img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/facebook.png"
                          alt="Facebook"
                          width="24"
                          height="24"
                          style="vertical-align: middle; border: 0"
                        />
                      </a>
                      <a
                        href="https://x.com/Anvesha_IISER"
                        target="_blank"
                        style="
                          text-decoration: none;
                          margin: 0 6px;
                          display: inline-block;
                        "
                      >
                        <img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/twitter.png"
                          alt="Twitter"
                          width="24"
                          height="24"
                          style="vertical-align: middle; border: 0"
                        />
                      </a>
                      <a
                        href="https://youtube.com/@stciisertvm"
                        target="_blank"
                        style="
                          text-decoration: none;
                          margin: 0 6px;
                          display: inline-block;
                        "
                      >
                        <img
                          src="https://raw.githubusercontent.com/PragunNepal/Srijana/refs/heads/main/icons/youtube.png"
                          alt="YouTube"
                          width="24"
                          height="24"
                          style="vertical-align: middle; border: 0"
                        />
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
